<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة سباق الطريق</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 700px;
            background-color: #2c3e50;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #powerup-status {
            position: absolute;
            top: 50px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 10;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: none;
        }
        .badge-shield {
            background-color: #00d2d3;
            color: #000;
        }
        .badge-slow {
            background-color: #ff9f43;
            color: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        .overlay h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #f1c40f;
        }
        .overlay p {
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
            background-color: #27ae60;
        }
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.6);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div>المسافة: <span id="dist-val">0</span> م</div>
            <div>السرعة: <span id="speed-val">1.0</span>x</div>
            <div>الأفضل: <span id="best-val">0</span> م</div>
        </div>

        <div id="powerup-status">
            <div id="shield-badge" class="badge badge-shield">🛡️ الدرع نشط</div>
            <div id="slow-badge" class="badge badge-slow">⏱️ تباطؤ: <span id="slow-timer">3</span>s</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-overlay" class="overlay">
            <h1>سباق الطريق</h1>
            <p>تجنب السيارات، اجمع الدروع 🛡️ والتباطؤ الزمني ⏱️ واستمر في القيادة!</p>
            <button id="start-btn" class="btn">ابدأ اللعب</button>
        </div>

        <div id="gameover-overlay" class="overlay hidden">
            <h1>انتهت اللعبة!</h1>
            <p>المسافة النهائية: <span id="final-dist">0</span> م</p>
            <button id="restart-btn" class="btn">إعادة المحاولة</button>
        </div>

        <div id="mobile-controls">
            <div id="btn-left" class="touch-btn">►</div>
            <div id="btn-right" class="touch-btn">◄</div>
        </div>
    </div>

    <script>
        // CONFIGURATION VARIABLES
        const INITIAL_SPEED = 300;      // Initial speed in pixels per second
        const SPEED_INCREMENT = 12;     // Speed increase per second
        const MAX_SPEED = 950;          // Maximum speed limit
        const ROW_SPACING = 260;        // Vertical distance between obstacle rows
        const LANE_COUNT = 3;           // Number of driving lanes
        const MAX_DELTA_TIME = 0.1;     // Maximum cap for delta time (seconds) to prevent frame skips
        const SLOW_DURATION = 3.0;      // Time slow powerup duration in seconds
        const SLOW_FACTOR = 0.4;        // Obstacle speed multiplier during time slow

        // GAME STATE SETUP
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const distVal = document.getElementById('dist-val');
        const speedVal = document.getElementById('speed-val');
        const bestVal = document.getElementById('best-val');
        const finalDist = document.getElementById('final-dist');
        const shieldBadge = document.getElementById('shield-badge');
        const slowBadge = document.getElementById('slow-badge');
        const slowTimer = document.getElementById('slow-timer');
        
        const startOverlay = document.getElementById('start-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        let animationFrameId = null;
        let lastTime = 0;
        let distance = 0;
        let currentSpeed = INITIAL_SPEED;
        let bestDistance = localStorage.getItem('race_best_score') || 0;
        let isRunning = false;

        let player = {
            lane: 1,
            x: 0,
            y: 0,
            width: 44,
            height: 75,
            targetX: 0,
            hasShield: false,
            slowTimer: 0
        };

        let obstacles = [];
        let powerups = [];
        let roadOffset = 0;
        let touchStartX = 0;

        bestVal.textContent = Math.floor(bestDistance);

        // RESIZE CANVAS TO FIT DISPLAY
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            if (player) {
                updatePlayerTargetX();
                player.x = player.targetX;
                player.y = canvas.height - player.height - 30;
            }
        }
        window.addEventListener('resize', resizeCanvas);

        function updatePlayerTargetX() {
            const laneWidth = canvas.width / LANE_COUNT;
            player.targetX = (player.lane * laneWidth) + (laneWidth - player.width) / 2;
        }

        // RESET ALL STATE IN A SINGLE FUNCTION
        function resetGameState() {
            distance = 0;
            currentSpeed = INITIAL_SPEED;
            obstacles = [];
            powerups = [];
            roadOffset = 0;
            lastTime = 0;
            
            player.lane = 1;
            player.width = 44;
            player.height = 75;
            player.y = canvas.height - player.height - 30;
            player.hasShield = false;
            player.slowTimer = 0;
            updatePlayerTargetX();
            player.x = player.targetX;

            distVal.textContent = '0';
            speedVal.textContent = '1.0';
            shieldBadge.style.display = 'none';
            slowBadge.style.display = 'none';

            spawnInitialObstacles();
        }

        function spawnInitialObstacles() {
            let currentY = -ROW_SPACING;
            while (currentY > -canvas.height * 1.5) {
                spawnObstacleRow(currentY);
                currentY -= ROW_SPACING;
            }
        }

        function spawnObstacleRow(yPos) {
            const laneWidth = canvas.width / LANE_COUNT;
            
            // Strictly guarantee at least one empty lane
            const emptyLane = Math.floor(Math.random() * LANE_COUNT);

            for (let i = 0; i < LANE_COUNT; i++) {
                if (i !== emptyLane) {
                    if (Math.random() < 0.7) {
                        const obsWidth = 44;
                        const obsHeight = 75;
                        const obsX = (i * laneWidth) + (laneWidth - obsWidth) / 2;
                        
                        obstacles.push({
                            x: obsX,
                            y: yPos,
                            width: obsWidth,
                            height: obsHeight,
                            lane: i
                        });
                    }
                } else {
                    // Chance to spawn powerup in empty lane
                    if (Math.random() < 0.35) {
                        const type = Math.random() < 0.5 ? 'shield' : 'slow';
                        const pSize = 30;
                        const pX = (i * laneWidth) + (laneWidth - pSize) / 2;
                        powerups.push({
                            x: pX,
                            y: yPos + (ROW_SPACING / 2),
                            width: pSize,
                            height: pSize,
                            type: type
                        });
                    }
                }
            }
        }

        // CONTROL HANDLERS (STRICT LANE BOUNDARIES)
        function moveLeft() {
            if (!isRunning) return;
            if (player.lane > 0) {
                player.lane--;
                updatePlayerTargetX();
            }
        }

        function moveRight() {
            if (!isRunning) return;
            if (player.lane < LANE_COUNT - 1) {
                player.lane++;
                updatePlayerTargetX();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        });

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
        btnLeft.addEventListener('click', moveLeft);
        
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
        btnRight.addEventListener('click', moveRight);

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const diffX = touchEndX - touchStartX;
            if (Math.abs(diffX) > 30) {
                if (diffX > 0) moveLeft(); // RTL Layout adjustment
                else moveRight();
            }
        }, { passive: true });

        // COLLISION DETECTION WITH SHRUNK HITBOXES
        function checkCollision(rect1, rect2) {
            const paddingX = rect1.width * 0.18;
            const paddingY = rect1.height * 0.15;

            return (
                rect1.x + paddingX < rect2.x + rect2.width - paddingX &&
                rect1.x + rect1.width - paddingX > rect2.x + paddingX &&
                rect1.y + paddingY < rect2.y + rect2.height - paddingY &&
                rect1.y + rect1.height - paddingY > rect2.y + paddingY
            );
        }

        // MAIN GAME LOOP
        function gameLoop(timestamp) {
            if (!isRunning) return;

            if (!lastTime) lastTime = timestamp;
            let deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Cap max delta time to prevent clipping obstacles when switching tabs
            if (deltaTime > MAX_DELTA_TIME) {
                deltaTime = MAX_DELTA_TIME;
            }

            // UPDATE GAME STATE
            currentSpeed = Math.min(MAX_SPEED, currentSpeed + SPEED_INCREMENT * deltaTime);
            distance += (currentSpeed * deltaTime) / 20;

            roadOffset = (roadOffset + currentSpeed * deltaTime) % 40;

            // Update Time Slow Powerup Timer
            if (player.slowTimer > 0) {
                player.slowTimer -= deltaTime;
                slowBadge.style.display = 'block';
                slowTimer.textContent = Math.ceil(player.slowTimer);
                if (player.slowTimer <= 0) {
                    player.slowTimer = 0;
                    slowBadge.style.display = 'none';
                }
            }

            // Smooth player movement
            player.x += (player.targetX - player.x) * 15 * deltaTime;

            // Obstacle Movement Multiplier based on Time Slow Active
            const obstacleSpeedMultiplier = player.slowTimer > 0 ? SLOW_FACTOR : 1.0;
            const effectiveObstacleSpeed = currentSpeed * obstacleSpeedMultiplier;

            // Move & Check Powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += effectiveObstacleSpeed * deltaTime;

                if (checkCollision(player, p)) {
                    if (p.type === 'shield') {
                        player.hasShield = true;
                        shieldBadge.style.display = 'block';
                    } else if (p.type === 'slow') {
                        player.slowTimer = SLOW_DURATION;
                    }
                    powerups.splice(i, 1);
                    continue;
                }

                if (p.y > canvas.height + 100) {
                    powerups.splice(i, 1);
                }
            }

            // Move obstacles and check collision
            let highestObstacleY = 0;
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += effectiveObstacleSpeed * deltaTime;

                if (obs.y < highestObstacleY) {
                    highestObstacleY = obs.y;
                }

                if (checkCollision(player, obs)) {
                    if (player.hasShield) {
                        player.hasShield = false;
                        shieldBadge.style.display = 'none';
                        obstacles.splice(i, 1); // Destroy obstacle on shield hit
                        continue;
                    } else {
                        endGame();
                        return;
                    }
                }

                // Clean off-screen obstacles
                if (obs.y > canvas.height + 100) {
                    obstacles.splice(i, 1);
                }
            }

            // Spawn next rows
            if (obstacles.length === 0 || highestObstacleY > -canvas.height + ROW_SPACING) {
                const newY = highestObstacleY ? highestObstacleY - ROW_SPACING : -ROW_SPACING;
                spawnObstacleRow(newY);
            }

            // UPDATE UI
            distVal.textContent = Math.floor(distance);
            speedVal.textContent = (currentSpeed / INITIAL_SPEED).toFixed(1);

            // RENDER GRAPHICS
            render();

            // Schedule next frame
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // DRAW POWERUP GRAPHICS
        function drawPowerup(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.font = '22px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            if (p.type === 'shield') {
                ctx.fillText('🛡️', p.width / 2, p.height / 2);
            } else {
                ctx.fillText('⏱️', p.width / 2, p.height / 2);
            }
            ctx.restore();
        }

        // DRAW DETAILED CAR GRAPHICS
        function drawCar(x, y, width, height, mainColor, isPlayer) {
            ctx.save();
            ctx.translate(x, y);

            // Shield Glow Effect
            if (isPlayer && player.hasShield) {
                ctx.strokeStyle = '#00d2d3';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(width / 2, height / 2, width * 0.85, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Tires
            ctx.fillStyle = '#111';
            ctx.fillRect(-3, 10, 6, 16);                 // Top Left
            ctx.fillRect(width - 3, 10, 6, 16);          // Top Right
            ctx.fillRect(-3, height - 26, 6, 16);       // Bottom Left
            ctx.fillRect(width - 3, height - 26, 6, 16); // Bottom Right

            // Main Body
            ctx.fillStyle = mainColor;
            ctx.beginPath();
            ctx.roundRect(0, 0, width, height, 10);
            ctx.fill();

            // Roof / Cabin
            ctx.fillStyle = '#1e272c';
            ctx.beginPath();
            ctx.roundRect(4, 18, width - 8, height - 34, 6);
            ctx.fill();

            // Windshield & Rear Window
            ctx.fillStyle = '#415b76';
            ctx.fillRect(6, 22, width - 12, 10);        // Front Glass
            ctx.fillRect(6, height - 28, width - 12, 6); // Rear Glass

            // Lights
            if (isPlayer) {
                // Front Headlights (Yellow/White - facing UP)
                ctx.fillStyle = '#ffffa0';
                ctx.fillRect(4, 2, 8, 4);
                ctx.fillRect(width - 12, 2, 8, 4);

                // Tail lights (Red - at Bottom)
                ctx.fillStyle = '#ff2a2a';
                ctx.fillRect(4, height - 5, 8, 3);
                ctx.fillRect(width - 12, height - 5, 8, 3);
            } else {
                // Enemy Tail lights
                ctx.fillStyle = '#ff2a2a';
                ctx.fillRect(4, height - 5, 8, 3);
                ctx.fillRect(width - 12, height - 5, 8, 3);

                // Front Lights
                ctx.fillStyle = '#ffffa0';
                ctx.fillRect(4, 2, 8, 4);
                ctx.fillRect(width - 12, 2, 8, 4);
            }

            ctx.restore();
        }

        // RENDER FUNCTION
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Road Base
            ctx.fillStyle = '#34495e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Road Borders (Asphalt lines)
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(0, 0, 6, canvas.height);
            ctx.fillRect(canvas.width - 6, 0, 6, canvas.height);

            // Draw Lane Lines
            ctx.strokeStyle = '#ecf0f1';
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 20]);
            ctx.lineDashOffset = -roadOffset;

            const laneWidth = canvas.width / LANE_COUNT;
            for (let i = 1; i < LANE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, canvas.height);
                ctx.stroke();
            }

            // Draw Powerups
            for (const p of powerups) {
                drawPowerup(p);
            }

            // Draw Enemy Cars (Obstacles)
            for (const obs of obstacles) {
                drawCar(obs.x, obs.y, obs.width, obs.height, '#e74c3c', false);
            }

            // Draw Player Car
            drawCar(player.x, player.y, player.width, player.height, '#3498db', true);
        }

        // START GAME (CANCEL PENDING FRAMES PREVENTING DOUBLE LOOPS)
        function startGame() {
            if (animationFrameId !== null) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            resetGameState();
            isRunning = true;
            
            startOverlay.classList.add('hidden');
            gameoverOverlay.classList.add('hidden');

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // END GAME (STOP LOOP COMPLETELY)
        function endGame() {
            isRunning = false;
            
            if (animationFrameId !== null) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            if (distance > bestDistance) {
                bestDistance = distance;
                localStorage.setItem('race_best_score', bestDistance);
                bestVal.textContent = Math.floor(bestDistance);
            }

            finalDist.textContent = Math.floor(distance);
            gameoverOverlay.classList.remove('hidden');
        }

        // INITIALIZATION
        resizeCanvas();
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
